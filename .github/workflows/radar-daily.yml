name: Editalume · PNCP searchable catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'radar/collector.py'
      - 'radar/search_index.py'
      - 'radar/test_collector.py'
      - 'radar/test_search_index.py'
      - '.github/workflows/radar-daily.yml'
  schedule:
    - cron: '17 10 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: editalume-catalog-refresh
  cancel-in-progress: true
jobs:
  refresh:
    outputs:
      should_deploy: ${{ steps.publish.outputs.should_deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dashboard JavaScript syntax
        run: node --check public/radar/app.js
      - name: Offline validation
        run: PYTHONPATH=radar python -m unittest discover -s radar -p 'test_*.py' -v
      - name: Refresh public PNCP sample without credentials; keep last valid report on outage
        shell: bash
        run: |
          if python radar/collector.py --output public/radar/opportunities.json; then
            echo "RADAR_SAMPLE_RESULT=success" >> "$GITHUB_ENV"
          else
            echo "RADAR_SAMPLE_RESULT=failed" >> "$GITHUB_ENV"
            test -s public/radar/opportunities.json || exit 1
            echo "::warning::PNCP sample failed. Retaining last stored report without changing timestamp."
          fi
      - name: Extend deduplicated searchable PNCP index; keep last valid index on outage
        shell: bash
        run: |
          if python radar/search_index.py --output public/radar/search-index.json; then
            if python -c 'import json; d=json.load(open("public/radar/search-index.json")); exit(0 if not d.get("partial") else 1)'; then
              echo "RADAR_INDEX_RESULT=success" >> "$GITHUB_ENV"
            else
              echo "RADAR_INDEX_RESULT=partial" >> "$GITHUB_ENV"
              echo "::warning::Index is partial; the report discloses any reused verified sample and stale carry-forward entries."
            fi
          else
            echo "RADAR_INDEX_RESULT=failed" >> "$GITHUB_ENV"
            test -s public/radar/search-index.json || exit 1
            echo "::warning::PNCP index failed. Retaining last stored index without changing timestamp."
          fi
      - name: Record last attempted refresh and degraded status
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime,timezone
          from pathlib import Path
          sample=os.environ.get("RADAR_SAMPLE_RESULT", "unknown")
          index=os.environ.get("RADAR_INDEX_RESULT", "unknown")
          result={"attempted_at":datetime.now(timezone.utc).isoformat(),
                  "sample_refresh":sample,"index_refresh":index,
                  "degraded":sample!="success" or index!="success",
                  "notice":"An attempted refresh may fail. Existing documents retain their original successful data timestamp. Source PNCP always prevails."}
          Path("public/radar/refresh-status.json").write_text(json.dumps(result,indent=2)+"\n",encoding="utf-8")
          print(result)
          PY
      - name: Publish verified snapshot only when checkout is still current
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          git add public/radar/opportunities.json public/radar/search-index.json public/radar/refresh-status.json
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::warning::Repository advanced during PNCP collection; newer workflow owns publishing. Do not deploy stale source."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          elif git diff --cached --quiet; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh public PNCP sample'
            if git push origin HEAD:main; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            else
              # A concurrent update won the race. Never replace newer source
              # or deploy the stale checkout's generated public files.
              git fetch origin main
              if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
                echo "::warning::Newer repository revision detected. Superseded run will not deploy."
                echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              else
                echo "::error::Publish failed without a confirmed newer revision"
                exit 1
              fi
            fi
          fi
      - name: Build the public site with freshly collected data
        if: steps.publish.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static searchable catalog and EU application
        if: steps.publish.outputs.should_deploy == 'true'
        run: |
          npm install
          npm run build
      - name: Upload site with fresh data
        if: steps.publish.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: needs.refresh.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    needs: refresh
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy refreshed public site
        id: deployment
        uses: actions/deploy-pages@v4
