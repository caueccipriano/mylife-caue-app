name: Editalume · PNCP searchable catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'radar/**'
      - '.github/workflows/radar-daily.yml'
  schedule:
    - cron: '17 10 * * *'
permissions:
  contents: write
concurrency:
  group: editalume-catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dashboard JavaScript syntax
        run: node --check public/radar/app.js
      - name: Offline validation
        run: PYTHONPATH=radar python -m unittest discover -s radar -p 'test_*.py' -v
      - name: Refresh public PNCP sample without credentials
        run: python radar/collector.py --output public/radar/opportunities.json
      - name: Commit sampled official listings to public site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/radar/opportunities.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh public PNCP sample'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
