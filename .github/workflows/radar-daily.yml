name: Editalume · PNCP searchable catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'radar/**'
      - '.github/workflows/radar-daily.yml'
  schedule:
    - cron: '17 10 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: editalume-catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dashboard JavaScript syntax
        run: node --check public/radar/app.js
      - name: Offline validation
        run: PYTHONPATH=radar python -m unittest discover -s radar -p 'test_*.py' -v
      - name: Refresh public PNCP sample without credentials
        run: python radar/collector.py --output public/radar/opportunities.json
      - name: Extend deduplicated searchable PNCP index
        run: python radar/search_index.py --output public/radar/search-index.json
      - name: Commit searchable official listings to public site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/radar/opportunities.json public/radar/search-index.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh public PNCP sample'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build the public site with freshly collected data
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static searchable catalog and EU application
        run: |
          npm install
          npm run build
      - name: Upload site with fresh data
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: refresh
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy refreshed public site
        id: deployment
        uses: actions/deploy-pages@v4
