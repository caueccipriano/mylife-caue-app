name: Editalume · retired monorepo collector (offline tests only)
# Migrated to CIPRI-studios/editalume on 2026-10-02.
# Do not schedule or upload national tenders from this legacy application.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Historical collector offline regression tests
        run: |
          PYTHONPATH=radar python -m unittest radar.test_national_collector -v
          python radar/national_collector.py --offline-check
