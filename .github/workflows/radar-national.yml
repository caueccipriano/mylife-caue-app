name: Editalume · national rotating PNCP sync
on:
  workflow_dispatch:
    inputs:
      states:
        description: "Optional: 1–3 UFs separated by commas (e.g. AC,RJ,SP)"
        type: string
        required: false
  pull_request:
    paths:
      - 'radar/national_collector.py'
      - 'radar/test_national_collector.py'
      - 'radar/collector.py'
      - 'supabase/functions/editalume-ingest/**'
      - '.github/workflows/radar-national.yml'
  push:
    branches: [main]
    paths:
      - 'radar/national_collector.py'
      - 'radar/test_national_collector.py'
      - 'radar/collector.py'
      - 'supabase/functions/editalume-ingest/**'
      - '.github/workflows/radar-national.yml'
  schedule:
    - cron: '23 0,3,6,9,12,15,18,21 * * *'
permissions:
  contents: read
concurrency:
  group: editalume-national-sync
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: National collector unit and safety tests
        run: PYTHONPATH=radar python -m unittest radar.test_national_collector -v
      - name: Ensure no secret-based ingestion
        run: |
          python -m py_compile radar/national_collector.py
          python radar/national_collector.py --offline-check
  synchronize:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      id-token: write
      contents: read
    env:
      REQUESTED_UFS: ${{ inputs.states }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PNCP round-robin — 3 UFs, 2 proven modalities, 1 page each
        run: |
          set +x
          PYTHONUNBUFFERED=1 python radar/national_collector.py
